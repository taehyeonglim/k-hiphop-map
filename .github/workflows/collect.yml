name: Collect weekly data candidates
on:
  schedule:
    - cron: '0 21 * * 0'
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: data/catalog.sqlite
          key: music-catalog-${{ github.run_id }}
          restore-keys: music-catalog-
      - run: python3 scripts/collect.py --refresh
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-catalog-candidates
          path: |
            data/catalog.json
            data/pending.json
            data/resolved-seeds.json
            docs/data-audit.md
          retention-days: 30
