name: Collect weekly data candidates
on:
  schedule:
    - cron: '0 21 * * 0'
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            data/catalog.sqlite
            .cache/portraits
            .cache/archive-run/releases
          key: music-catalog-${{ github.run_id }}
          restore-keys: music-catalog-
      - run: python3 -m pip install -r requirements.txt
      - run: python3 scripts/collect-releases.py --discover --refresh
      - run: python3 scripts/survey-portraits.py --retry-days 30
      - run: python3 scripts/survey-profile-sources.py --merge-review
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-catalog-candidates
          path: |
            data/catalog.json
            data/pending.json
            data/resolved-seeds.json
            docs/data-audit.md
            data/portrait-review.json
            data/portrait-source-candidates.json
            .cache/archive-run/archive.json
            .cache/archive-run/release-audit.json
            .cache/portraits/candidates.json
            .cache/portraits/candidates/
          retention-days: 30
